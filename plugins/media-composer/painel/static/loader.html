<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>De Lá Pra Cá</title>
<style>  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body {
    background:#2b2b2b; color:#e2e2e2;
    font:13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .caixa { max-width:320px; }
  h1 { font-size:15px; font-weight:700; margin:0 0 4px; letter-spacing:.2px; }
  .sub { color:#a8a8a8; font-size:11px; margin:0 0 18px; }
  .estado { color:#a8a8a8; font-size:12px; line-height:1.6; }
  .estado strong { color:#e2e2e2; display:block; margin-bottom:4px; }
  .ponto {
    display:inline-block; width:8px; height:8px; border-radius:50%;
    background:#8a8a8a; margin-right:6px; vertical-align:middle;
    animation:pulsa 1.6s ease-in-out infinite;
  }
  @keyframes pulsa { 0%,100% { opacity:.35 } 50% { opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .ponto { animation:none; opacity:.7 } }
  .versao { color:#6d6d6d; font-size:10px; margin-top:18px;
            font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="caixa">
    <h1>De Lá Pra Cá</h1>
    <p class="sub">Media Composer</p>
    <div class="estado" id="estado"><span class="ponto"></span>procurando o serviço…</div>
    <div class="versao" id="versao"></div>
  </div>

<script src="version.js"></script>
<script>"use strict";

var SERVICO = "http://127.0.0.1:7823";
var INTERVALO = 4000;
var estado = document.getElementById("estado");

document.getElementById("versao").textContent =
  "painel v" + (window.DELAPRACA_VERSAO || "?");

var tentativas = 0;

function procurar() {
  tentativas++;
  fetch(SERVICO + "/health", { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)); })
    .then(function (s) {
      estado.innerHTML = "<strong>Encontrei.</strong>abrindo…";
      window.location.replace(SERVICO + (s.ui || "/painel"));
    })
    .catch(function () {
      estado.innerHTML = tentativas < 3
        ? '<span class="ponto"></span>procurando o serviço…'
        : "<strong>Serviço não encontrado.</strong>" +
          "Abra o app De Lá Pra Cá uma vez para instalá-lo, " +
          "ou verifique se ele está rodando.";
    });
}

procurar();
setInterval(procurar, INTERVALO);
</script>
</body>
</html>
