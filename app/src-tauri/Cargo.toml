[package]
name = "delapraca"
version = "0.1.7"
description = "Relinka a timeline para a mídia original, sem sair do Media Composer"
authors = ["Ciclo Media"]
edition = "2021"

[lib]
name = "delapraca_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
