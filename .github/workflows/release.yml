name: Instaladores

on:
  push:
    tags:
      - "v*"

jobs:
  instalador:
    if: github.repository == 'Lohan-Costa/delapraca'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            alvo: x86_64-pc-windows-msvc
            pasta: nsis
            extensao: exe
          - plataforma: macos-latest
            alvo: aarch64-apple-darwin
            pasta: dmg
            extensao: dmg
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          targets: ${{ matrix.alvo }}
      - name: Dependências do build
        run: python -m pip install -r requirements-build.txt
      - name: Ferramenta de build do Tauri
        run: cargo install tauri-cli --version 2.11.5 --locked
      - name: Instalador
        run: python tools/montar_instalador.py ${{ matrix.alvo }}
      - name: Publicar na versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" \
            --title "De Lá Pra Cá $GITHUB_REF_NAME" \
            --notes "Instalador do De Lá Pra Cá. Windows: o arquivo .exe. O instalador não tem assinatura digital: o Windows mostra o aviso do SmartScreen; clique em Mais informações e depois em Executar assim mesmo. Mac (Apple Silicon): o arquivo .dmg; arraste o app para Aplicativos. Ele não tem certificado da Apple: na primeira abertura clique em OK, depois em Ajustes do Sistema, Privacidade e Segurança, Abrir Mesmo Assim. Depois de instalar, abra o De Lá Pra Cá e instale os plugins em Configurações, Integrações." || true
          gh release upload "$GITHUB_REF_NAME" app/src-tauri/target/${{ matrix.alvo }}/release/bundle/${{ matrix.pasta }}/*.${{ matrix.extensao }} --clobber
